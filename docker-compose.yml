version: '3.8'

services:
  omnivision-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnivision-docintel-service
    ports:
      - "8000:8000"
    environment:
      - API_KEY=demo-omni-key-2026
      - RATE_LIMIT_PER_MINUTE=120
      - BLUR_THRESHOLD=100.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
